document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<link rel=\"canonical\" href=\"https://intentional-mediation.com/workplace\">\n<style>\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: #FFFFFF; }\n  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n  a { color: #007BA7; text-decoration: none; }\n  a:hover { color: #0A0A0A; }\n  ::selection { background: #007BA7; color: #FFFFFF; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#FFFFFF;color:#0A0A0A;font-family:Newsreader,Georgia,serif;min-height:100vh;overflow-x:hidden\">\n\n  <header style=\"position:sticky;top:0;z-index:20;background:rgba(251,249,245,0.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid rgba(10,10,10,0.1)\">\n    <div style=\"width:min(100%,1240px);margin:0 auto;padding:0 clamp(20px,4vw,56px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;min-height:74px\">\n      <a href=\"index.html\" style=\"display:flex;align-items:center;gap:12px;color:#0A0A0A;padding:13px 0\">\n        <span style=\"display:flex;flex-direction:column;gap:5px\">\n          <span style=\"font-family:'Libre Baskerville',serif;font-size:24px;font-weight:700;letter-spacing:0.04em;line-height:0.9\">Intentional<span style=\"color:#007BA7\">.<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.19em;text-transform:uppercase;color:#007BA7;line-height:1\">Mediation &amp; Facilitation<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;column-gap:clamp(16px,3vw,38px);row-gap:4px;font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase\">\n        <a href=\"workplace.html\" style=\"color:#0A0A0A;padding:16px 0;border-bottom:1px solid #007BA7\">Workplace<\u002Fa>\n        <a href=\"about.html\" style=\"color:#4A4A4A;padding:16px 0;border-bottom:1px solid transparent\" style-hover=\"color:#0A0A0A;border-bottom:1px solid #007BA7\">About<\u002Fa>\n        <a href=\"faq.html\" style=\"color:#4A4A4A;padding:16px 0;border-bottom:1px solid transparent\" style-hover=\"color:#0A0A0A;border-bottom:1px solid #007BA7\">FAQ<\u002Fa>\n        <a sc-camel-on-click=\"{{ openContact }}\" style=\"color:#4A4A4A;padding:16px 0;border-bottom:1px solid transparent;cursor:pointer\" style-hover=\"color:#0A0A0A;border-bottom:1px solid #007BA7\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"workplace\" style=\"width:min(100%,1240px);margin:0 auto;padding:clamp(56px,9vw,124px) clamp(20px,4vw,56px) clamp(72px,11vw,148px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,6vw,88px)\">\n      <div style=\"flex:1 1 200px;max-width:250px\">\n        <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#007BA7;border-top:1px solid #007BA7;padding-top:14px\">For organizations<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 520px\">\n        <h2 style=\"margin:0;font-size:clamp(34px,4.6vw,60px);line-height:1.03;font-weight:300;letter-spacing:-0.028em;max-width:15em\">Workplace mediation and training, run as a process — not a conversation.<\u002Fh2>\n        <p style=\"margin:clamp(24px,3vw,34px) 0 0;font-size:clamp(18px,1.5vw,21px);line-height:1.6;color:#2B2B2B;max-width:34em\">We help organizations get ahead of conflict—through training that prevents escalation and mediation that can resolve it. Whether it's restructuring, leadership change, scaling, or shifts in how people work together, we have a way to navigate it.<\u002Fp>\n        <div style=\"margin-top:clamp(28px,3.5vw,40px);padding:clamp(20px,2.5vw,28px);background:#F3F5F7;border-left:3px solid #007BA7\">\n          <p style=\"margin:0 0 clamp(16px,2vw,20px);font-size:16px;line-height:1.5;font-weight:600;color:#0A0A0A\">Unresolved workplace conflict is expensive. Here's what it costs:<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(16px,2vw,24px);font-size:15px;line-height:1.6;color:#2B2B2B\">\n            <div><strong>$300 billion<\u002Fstrong> — annual cost to U.S. employers from unresolved workplace conflict<\u002Fdiv>\n            <div><strong>$3,216<\u002Fstrong> per employee per year in preventable productivity loss<\u002Fdiv>\n            <div><strong>45%<\u002Fstrong> of employees report sickness or absence tied to workplace conflict<\u002Fdiv>\n            <div><strong>20-40%<\u002Fstrong> of manager time spent managing conflict instead of leading<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:clamp(16px,2vw,20px) 0 0;font-size:16px;line-height:1.6;color:#2B2B2B;border-top:1px solid rgba(10,10,10,0.14);padding-top:clamp(16px,2vw,20px)\">Most conflicts go unaddressed until the damage is done—until someone leaves, a team fractures, or morale bottoms out. Early intervention through mediation and conflict resolution training prevents escalation, protects your people, and protects your bottom line.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:clamp(36px,5vw,56px);border-top:1px solid rgba(10,10,10,0.14)\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:22px 4px;border-bottom:1px solid rgba(10,10,10,0.14)\">\n            <span style=\"flex:1 1 200px;font-size:clamp(21px,2vw,26px);letter-spacing:-0.02em\">Training<\u002Fspan>\n            <span style=\"flex:1 1 260px;font-size:16px;line-height:1.5;color:#5C5C5C\">Building the skills inside your organization so managers recognize and address conflict early.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:22px 4px;border-bottom:1px solid rgba(10,10,10,0.14)\">\n            <span style=\"flex:1 1 200px;font-size:clamp(21px,2vw,26px);letter-spacing:-0.02em\">Mediation<\u002Fspan>\n            <span style=\"flex:1 1 260px;font-size:16px;line-height:1.5;color:#5C5C5C\">Structured sessions that move toward resolution, even on the hardest disagreements.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:22px 4px;border-bottom:1px solid rgba(10,10,10,0.14)\">\n            <span style=\"flex:1 1 200px;font-size:clamp(21px,2vw,26px);letter-spacing:-0.02em\">Facilitation &amp; Workshops<\u002Fspan>\n            <span style=\"flex:1 1 260px;font-size:16px;line-height:1.5;color:#5C5C5C\">Team-level work that reveals patterns and builds the shared language teams need to work through conflict together.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#0A0A0A;color:#FFFFFF\">\n    <div style=\"width:min(100%,1240px);margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,56px)\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,6vw,88px)\">\n        <div style=\"flex:1 1 200px;max-width:250px\">\n          <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#8FC4DC;border-top:1px solid rgba(255,255,255,0.28);padding-top:14px\">Why Intentional<\u002Fdiv>\n        <\u002Fdiv>\n        <blockquote style=\"flex:1 1 520px;margin:0;font-size:clamp(28px,3.9vw,50px);line-height:1.14;font-weight:300;letter-spacing:-0.03em;max-width:22em\">Mediation isn't about splitting the difference. It's about building an agreement you actually <em style=\"font-weight:300;color:#63C1E8\">chose<\u002Fem>, on purpose.<\u002Fblockquote>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"width:min(100%,1240px);margin:0 auto;padding:clamp(72px,11vw,148px) clamp(20px,4vw,56px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,6vw,88px)\">\n      <div style=\"flex:1 1 200px;max-width:250px\">\n        <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#007BA7;border-top:1px solid #007BA7;padding-top:14px\">The method<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 520px\">\n        <h2 style=\"margin:0;font-size:clamp(34px,4.6vw,60px);line-height:1.03;font-weight:300;letter-spacing:-0.028em;max-width:16em\">Not guesswork. Not just a conversation.<\u002Fh2>\n        <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,3.5vw,48px);margin-top:clamp(28px,3.5vw,44px)\">\n          <p style=\"flex:1 1 280px;margin:0;font-size:17px;line-height:1.68;color:#2B2B2B\">Most workplace conflicts go unresolved because no one has a clear way to address them. We start with a validated assessment that shows how people actually respond to conflict—before anyone's in a mediation room. That data shapes everything: whether we're coaching one person, mediating two, or working with a team.<\u002Fp>\n          <p style=\"flex:1 1 280px;margin:0;font-size:17px;line-height:1.68;color:#2B2B2B\">This also means we don't stop at the interpersonal dispute in front of us. Group and organizational patterns — how a team handles conflict collectively, where authority and trust break down at scale — become visible in a way a single mediation conversation won't surface. We work at that level too, not just the individual disagreement that got us in the room.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:clamp(40px,5vw,64px);border:1px solid rgba(10,10,10,0.16);background:#F3F5F7\">\n          <div style=\"padding:clamp(22px,3vw,32px);border-bottom:1px solid rgba(10,10,10,0.12);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px\">\n            <div>\n              <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#5C5C5C\">The instrument<\u002Fdiv>\n              <div style=\"font-size:clamp(23px,2.2vw,29px);letter-spacing:-0.022em;margin-top:8px\">Conflict Dynamics Profile — Individual<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:11px;letter-spacing:0.1em;color:#5C5C5C;text-transform:uppercase\">CDP-I<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap\">\n            <div style=\"flex:1 1 200px;padding:clamp(20px,2.4vw,26px);border-right:1px solid rgba(10,10,10,0.12);border-bottom:1px solid rgba(10,10,10,0.12)\">\n              <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#5C5C5C\">What it measures<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font-size:16px;line-height:1.55;color:#2B2B2B\">Constructive and destructive responses to conflict, before escalation, during, and after.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 200px;padding:clamp(20px,2.4vw,26px);border-right:1px solid rgba(10,10,10,0.12);border-bottom:1px solid rgba(10,10,10,0.12)\">\n              <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#5C5C5C\">Validated by<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font-size:16px;line-height:1.55;color:#2B2B2B\">Mediation Training Institute at Eckerd College; administered under certification.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 200px;padding:clamp(20px,2.4vw,26px);border-bottom:1px solid rgba(10,10,10,0.12)\">\n              <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#5C5C5C\">What you get<\u002Fdiv>\n              <p style=\"margin:9px 0 0;font-size:16px;line-height:1.55;color:#2B2B2B\">A read on the individuals and the group pattern — and a process designed around both.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px clamp(22px,3vw,32px);font-family:Archivo,system-ui,sans-serif;font-size:12px;letter-spacing:0.02em;color:#5C5C5C\">Every engagement starts here. Nothing is designed before the assessment is read.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showEngagementTable }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"width:min(100%,1240px);margin:0 auto;padding:0 clamp(20px,4vw,56px) clamp(72px,11vw,148px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(32px,6vw,88px)\">\n      <div style=\"flex:1 1 200px;max-width:250px\">\n        <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#007BA7;border-top:1px solid #007BA7;padding-top:14px\">Engagement structure<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 520px\">\n        <div style=\"border-top:2px solid #0A0A0A\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding:14px 0;border-bottom:1px solid rgba(10,10,10,0.14);font-family:Archivo,system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#5C5C5C\">\n            <span style=\"flex:1 1 160px\">Format<\u002Fspan>\n            <span style=\"flex:1 1 160px\">Who's in the room<\u002Fspan>\n            <span style=\"flex:1 1 160px\">Typical shape<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding:20px 0;border-bottom:1px solid rgba(10,10,10,0.14)\">\n            <span style=\"flex:1 1 160px;font-size:19px;letter-spacing:-0.015em\">Mediation<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#2B2B2B\">Two parties, plus a sponsor from HR or leadership<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#5C5C5C\">Assessment, individual pre-sessions, joint sessions to written agreement<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding:20px 0;border-bottom:1px solid rgba(10,10,10,0.14)\">\n            <span style=\"flex:1 1 160px;font-size:19px;letter-spacing:-0.015em\">Coaching<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#2B2B2B\">One person carrying the conflict<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#5C5C5C\">Assessment debrief plus a short series of one-to-one sessions<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding:20px 0;border-bottom:1px solid rgba(10,10,10,0.14)\">\n            <span style=\"flex:1 1 160px;font-size:19px;letter-spacing:-0.015em\">Facilitation<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#2B2B2B\">An intact team, a leadership group, or an offsite<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#5C5C5C\">Group-level read, designed session or session series, documented outcomes<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding:20px 0;border-bottom:1px solid rgba(10,10,10,0.14)\">\n            <span style=\"flex:1 1 160px;font-size:19px;letter-spacing:-0.015em\">Training<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#2B2B2B\">Managers, HR partners, or internal facilitators<\u002Fspan>\n            <span style=\"flex:1 1 160px;font-size:16px;line-height:1.5;color:#5C5C5C\">Curriculum built to your context, up to train-the-trainer<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:22px 0 0;font-size:16px;line-height:1.6;color:#5C5C5C;max-width:40em\">Every engagement is scoped after a short consultation, once we know who's involved and what the situation actually needs. <a href=\"mailto:joline@intentional-mediation.com?subject=Consultation\" style=\"border-bottom:1px solid rgba(0,123,167,0.4)\">Start there<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section style=\"border-top:1px solid rgba(10,10,10,0.12);background:#F3F5F7\">\n    <div style=\"width:min(100%,1240px);margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,4vw,56px)\">\n      <h2 style=\"margin:0;font-size:clamp(30px,3.9vw,50px);line-height:1.06;font-weight:300;letter-spacing:-0.03em;max-width:20em\">Not compromise. Not a verdict. An agreement you actually built.<\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,3.5vw,56px);margin-top:clamp(40px,5vw,64px)\">\n        <div style=\"flex:1 1 260px;border-top:2px solid #007BA7;padding-top:20px\">\n          <h3 style=\"margin:12px 0 10px;font-size:24px;font-weight:400;letter-spacing:-0.018em\">You decide, we structure<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2B2B2B\">We don't rule on outcomes. We run the process that gets you to one you actually chose.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px;border-top:2px solid #007BA7;padding-top:20px\">\n          <h3 style=\"margin:12px 0 10px;font-size:24px;font-weight:400;letter-spacing:-0.018em\">Direct, not diplomatic<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2B2B2B\">We name the real issue in the room. Avoiding it just moves the conflict later.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px;border-top:2px solid #007BA7;padding-top:20px\">\n          <h3 style=\"margin:12px 0 10px;font-size:24px;font-weight:400;letter-spacing:-0.018em\">Built to hold<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2B2B2B\">An agreement only works if it survives contact with real life. We test for that before you sign.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#0A0A0A;color:rgba(255,255,255,0.66)\">\n    <div style=\"width:min(100%,1240px);margin:0 auto;padding:clamp(40px,6vw,64px) clamp(20px,4vw,56px)\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,64px);justify-content:space-between\">\n        <div style=\"flex:1 1 260px\">\n          <div style=\"display:flex;align-items:center;gap:12px;color:#FFFFFF\">\n            <span style=\"display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:23px;font-weight:600;letter-spacing:-0.005em;line-height:0.9\">Intentional<span style=\"color:#63C1E8\">.<\u002Fspan><\u002Fspan>\n              <span style=\"font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.19em;text-transform:uppercase;color:#ABABAB;line-height:1\">Mediation &amp; Facilitation<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;font-size:15px;line-height:1.6;max-width:26em\">Mediation &amp; facilitation for organizations and the people inside them. Arlington, VA.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex:0 1 160px;font-family:Archivo,system-ui,sans-serif;font-size:12px;letter-spacing:0.06em\">\n          <div style=\"text-transform:uppercase;letter-spacing:0.18em;font-size:10px;color:#9C9C9C;margin-bottom:14px\">Site<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <a href=\"workplace.html\" style=\"color:rgba(255,255,255,0.72)\" style-hover=\"color:#FFFFFF\">Workplace<\u002Fa>\n            <a href=\"about.html\" style=\"color:rgba(255,255,255,0.72)\" style-hover=\"color:#FFFFFF\">About<\u002Fa>\n            <a sc-camel-on-click=\"{{ openContact }}\" style=\"color:rgba(255,255,255,0.72);cursor:pointer\" style-hover=\"color:#FFFFFF\">Contact<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 1 200px;font-family:Archivo,system-ui,sans-serif;font-size:12px\">\n          <div style=\"text-transform:uppercase;letter-spacing:0.18em;font-size:10px;color:#9C9C9C;margin-bottom:14px\">Contact<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <a href=\"mailto:joline@intentional-mediation.com\" style=\"color:rgba(255,255,255,0.72)\" style-hover=\"color:#FFFFFF\">hello@intentional-mediation.com<\u002Fa>\n            <span>Arlington, VA.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(32px,5vw,56px);padding-top:22px;border-top:1px solid rgba(255,255,255,0.14);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:Archivo,system-ui,sans-serif;font-size:11px;letter-spacing:0.06em;color:#9C9C9C\">\n        <span>© 2026 Intentional Mediation, LLC. All rights reserved.<\u002Fspan>\n        <span>Not legal advice. Mediation services only.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ contactOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:50;background:rgba(10,10,10,0.6);display:flex;align-items:center;justify-content:center;padding:20px\" sc-camel-on-click=\"{{ closeContact }}\">\n    <div style=\"background:#FFFFFF;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:clamp(28px,4vw,44px);border-top:3px solid #007BA7;position:relative\" sc-camel-on-click=\"{{ stopPropagation }}\">\n      <button sc-camel-on-click=\"{{ closeContact }}\" aria-label=\"Close\" style=\"position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;line-height:1;color:#5C5C5C;cursor:pointer;font-family:Archivo,system-ui,sans-serif\">×<\u002Fbutton>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:24px 0 8px\">\n          <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#007BA7;margin-bottom:14px\">Message sent<\u002Fdiv>\n          <p style=\"margin:0;font-size:19px;line-height:1.5\">Thanks — I'll be in touch within one business day.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#007BA7;margin-bottom:8px\">Get in touch<\u002Fdiv>\n        <h3 style=\"margin:0 0 22px;font-size:clamp(24px,3vw,30px);font-weight:300;letter-spacing:-0.02em\">Tell us what's going on.<\u002Fh3>\n        <form name=\"contact\" method=\"POST\" data-netlify=\"true\" netlify-honeypot=\"bot-field\" sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"display:flex;flex-direction:column;gap:18px\">\n          <input type=\"hidden\" name=\"form-name\" value=\"contact\">\n          <p style=\"display:none\">\n            <label>Don't fill this out if you're human: <input name=\"bot-field\"><\u002Flabel>\n          <\u002Fp>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#5C5C5C\">Name\n            <input type=\"text\" name=\"name\" required=\"\" style=\"border:none;border-bottom:1px solid rgba(10,10,10,0.2);padding:10px 0;font-family:Newsreader,Georgia,serif;font-size:16px;background:transparent;color:#0A0A0A\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#5C5C5C\">Email\n            <input type=\"email\" name=\"email\" required=\"\" style=\"border:none;border-bottom:1px solid rgba(10,10,10,0.2);padding:10px 0;font-family:Newsreader,Georgia,serif;font-size:16px;background:transparent;color:#0A0A0A\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#5C5C5C\">Organization\n            <input type=\"text\" name=\"organization\" style=\"border:none;border-bottom:1px solid rgba(10,10,10,0.2);padding:10px 0;font-family:Newsreader,Georgia,serif;font-size:16px;background:transparent;color:#0A0A0A\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#5C5C5C\">Message\n            <textarea name=\"message\" required=\"\" rows=\"4\" style=\"border:none;border-bottom:1px solid rgba(10,10,10,0.2);padding:10px 0;font-family:Newsreader,Georgia,serif;font-size:16px;background:transparent;color:#0A0A0A;resize:vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n          <button type=\"submit\" style=\"align-self:flex-start;margin-top:6px;background:#007BA7;color:#FFFFFF;border:none;padding:14px 30px;font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#0A0A0A\">Send<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showEngagementTable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { contactOpen: false, submitted: false };\n\n  openContact = () => this.setState({ contactOpen: true });\n  closeContact = () => this.setState({ contactOpen: false, submitted: false });\n  stopPropagation = (e) => e.stopPropagation();\n\n  handleSubmit = (e) => {\n    e.preventDefault();\n    const form = e.target;\n    const data = new URLSearchParams(new FormData(form)).toString();\n    fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: data })\n      .then(() => this.setState({ submitted: true }))\n      .catch(() => this.setState({ submitted: true }));\n  };\n\n  renderVals() {\n    return {\n      showEngagementTable: this.props.showEngagementTable ?? true,\n      contactOpen: this.state.contactOpen,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      openContact: this.openContact,\n      closeContact: this.closeContact,\n      stopPropagation: this.stopPropagation,\n      handleSubmit: this.handleSubmit,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
